name: Deploy portfolio to GitHub Pages

# Builds the Vite site and publishes it to GitHub Pages on every push to main.
# The live URL will be https://saloparv.github.io/parv-maurya-portfolio/
#
# NOTE ON IMAGE PATHS: because Pages serves this repo from a sub-path, any file
# you add to `public/images/` must be referenced WITHOUT a leading slash, e.g.
#   photo: 'images/profile.jpg'      ✅ works on Pages, Netlify and in the APK
#   photo: '/images/profile.jpg'     ❌ 404s on Pages (fine everywhere else)

on:
  push:
    branches: [main]
  # Lets you re-run a deploy by hand from the Actions tab.
  workflow_dispatch:

# Least-privilege token: read the repo, write the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, let the newer deploy win instead of queueing.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Tells vite.config.js to emit sub-path-aware asset URLs.
        env:
          VITE_BASE: /parv-maurya-portfolio/
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
